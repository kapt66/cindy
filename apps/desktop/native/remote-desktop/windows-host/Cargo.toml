[package]
name = "cindy-windows-desktop-host"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

# 该包同时产出 bin（cindy-windows-desktop-host.exe，被 NSIS 卸载与
# security.rs 的服务名哈希依赖）与 cdylib（复制为 cindy-windows-desktop-host.node）。
# cargo 在 deps/ 下把 bin 目标名里的 `-` 归一化为 `_`，若 lib 用默认的
# cindy_windows_desktop_host，两个目标会写同一个 cindy_windows_desktop_host.pdb；
# 两者并发链接时 link.exe 报 LNK1201（写入程序数据库失败），表现为 CI 偶发失败。
# 因此 lib 目标名必须与 bin 目标名归一化后的结果不同；产物对外名由 forge 复制决定，不受影响。
# 名字带 meka 是本仓在 meka/main 上新增命名的硬性要求（见
# docs/dev-rules/engineering-conventions.md §8）。
[lib]
name = "cindy_meka_windows_desktop_host_napi"
crate-type = ["cdylib"]

[build-dependencies]
napi-build = "=2.1.3"

[dependencies]
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
jpeg-encoder = "0.6"
napi = { version = "2", features = ["napi6", "tokio_rt"] }
napi-derive = "2"
tokio = { version = "1", features = ["rt"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authentication_Identity", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Services", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory", "Win32_System_Environment", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Graphics_Gdi"] }

[features]
default = ["windows-sys/Win32_System_JobObjects", "windows-sys/Win32_System_Registry", "windows-sys/Win32_System_SystemServices"]

[profile.release]
panic = "abort"
lto = true
opt-level = "s"
strip = true
